<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Médico | Sistema Hospitalar</title>


    <!-- =========================================
         FONTES
    ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           PÁGINA
        ========================================== */

        body {

            font-family: "Montserrat", sans-serif;

            background: #E8EEF2;

            color: #263746;

            min-height: 100vh;

            padding: 35px;
        }


        /* =========================================
           CONTAINER
        ========================================== */

        .container {

            width: 100%;

            max-width: 1050px;

            margin: 0 auto;

            background: #F8FAFB;

            padding: 40px;

            border-radius: 20px;

            border: 1px solid #D8E1E7;

            box-shadow:
                0 18px 45px rgba(11, 34, 57, 0.12);
        }


        /* =========================================
           CABEÇALHO
        ========================================== */

        .cabecalho {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 32px;
        }


        .hospital-logo {

            display: flex;

            align-items: center;

            gap: 13px;
        }


        .logo-icon {

            width: 46px;

            height: 46px;

            background: #0B2239;

            color: #FFFFFF;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            font-weight: 500;
        }


        .hospital-name {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 24px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }


        .hospital-subtitle {

            color: #718493;

            font-size: 9px;

            letter-spacing: 0.5px;

            margin-top: 1px;
        }


        /* =========================================
           TÍTULO
        ========================================== */

        .titulo {

            margin-bottom: 4px;
        }


        .titulo h1 {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 40px;

            font-weight: 600;

            line-height: 1;
        }


        .titulo p {

            color: #687B88;

            font-size: 11px;

            margin-top: 7px;
        }


        /* =========================================
           BOTÃO TV
        ========================================== */

        .btn-abrir-tv {

            background: #0B2239;

            color: #FFFFFF;

            border: none;

            padding: 13px 18px;

            border-radius: 9px;

            font-family: "Montserrat", sans-serif;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.3px;

            cursor: pointer;

            transition: all 0.25s ease;

            white-space: nowrap;
        }


        .btn-abrir-tv:hover {

            background: #071A2B;

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(11, 34, 57, 0.18);
        }


        /* =========================================
           CONSULTÓRIO
        ========================================== */

        .consultorio-input {

            display: flex;

            align-items: center;

            gap: 13px;

            margin-bottom: 30px;

            background: #EEF2F4;

            padding: 14px 16px;

            border-radius: 10px;

            border: 1px solid #D4DEE5;
        }


        .consultorio-input label {

            color: #304555;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.4px;
        }


        .consultorio-input input {

            width: 65px;

            height: 38px;

            text-align: center;

            font-size: 14px;

            font-weight: 600;

            color: #0B2239;

            background: #FFFFFF;

            border: 1px solid #CBD7DE;

            border-radius: 7px;

            outline: none;
        }


        .consultorio-input input:focus {

            border-color: #0B2239;

            box-shadow:
                0 0 0 3px rgba(11, 34, 57, 0.06);
        }


        .consultorio-input span {

            color: #71818C;

            font-size: 10px;
        }


        /* =========================================
           FILA DE PACIENTES
        ========================================== */

        #triagens {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 17px;

            margin-bottom: 30px;
        }


        /* =========================================
           CARD DO PACIENTE
        ========================================== */

        .card {

            background: #FFFFFF;

            border: 1px solid #D8E1E7;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 7px 20px rgba(11, 34, 57, 0.06);

            transition: all 0.25s ease;
        }


        .card:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(11, 34, 57, 0.10);
        }


        .card h3 {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 25px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        .card p {

            color: #607481;

            font-size: 10px;

            line-height: 1.7;

            margin-bottom: 4px;
        }


        .card p b {

            color: #304555;

            font-weight: 600;
        }


        /* =========================================
           RISCO
        ========================================== */

        .card .risco {

            display: inline-block;

            padding: 4px 9px;

            border-radius: 20px;

            background: #EEF2F4;

            color: #0B2239;

            font-size: 9px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.3px;
        }


        /* =========================================
           BOTÕES DOS CARDS
        ========================================== */

        .acoes-card {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 15px;
        }


        .acoes-card button {

            border: none;

            border-radius: 7px;

            padding: 9px 13px;

            font-family: "Montserrat", sans-serif;

            font-size: 9px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;
        }


        .btn-atender {

            background: #0B2239;

            color: #FFFFFF;
        }


        .btn-atender:hover {

            background: #071A2B;
        }


        .btn-tv {

            background: #E5EDF1;

            color: #0B2239;

            border: 1px solid #D0DCE2 !important;
        }


        .btn-tv:hover {

            background: #D8E3E8;
        }


        /* =========================================
           DIVISÓRIA
        ========================================== */

        hr {

            border: none;

            border-top: 1px solid #DDE5EA;

            margin: 10px 0 30px;
        }


        /* =========================================
           ÁREA DA CONSULTA
        ========================================== */

        .consulta-titulo {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 30px;

            font-weight: 600;

            margin-bottom: 18px;
        }


        .campo {

            margin-bottom: 15px;
        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid #D4DEE5;

            border-radius: 9px;

            background: #EEF2F4;

            color: #263746;

            font-family: "Montserrat", sans-serif;

            font-size: 11px;

            outline: none;

            transition: all 0.25s ease;
        }


        input,
        select {

            height: 50px;

            padding: 0 14px;
        }


        textarea {

            min-height: 115px;

            padding: 14px;

            resize: vertical;
        }


        input::placeholder,
        textarea::placeholder {

            color: #82919B;
        }


        input:focus,
        select:focus,
        textarea:focus {

            background: #FFFFFF;

            border-color: #0B2239;

            box-shadow:
                0 0 0 3px rgba(11, 34, 57, 0.07);
        }


        /* =========================================
           BOTÃO SALVAR
        ========================================== */

        .btn-salvar {

            width: 100%;

            height: 52px;

            margin-top: 3px;

            border: none;

            border-radius: 9px;

            background: #0B2239;

            color: #FFFFFF;

            font-family: "Montserrat", sans-serif;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: all 0.25s ease;
        }


        .btn-salvar:hover {

            background: #071A2B;

            transform: translateY(-1px);

            box-shadow:
                0 9px 22px rgba(11, 34, 57, 0.20);
        }


        /* =========================================
           RESPONSIVIDADE
        ========================================== */

        @media (max-width: 700px) {

            body {

                padding: 18px;
            }


            .container {

                padding: 28px 22px;

                border-radius: 16px;
            }


            .cabecalho {

                align-items: flex-start;

                flex-direction: column;
            }


            .btn-abrir-tv {

                width: 100%;
            }


            .consultorio-input {

                align-items: flex-start;

                flex-direction: column;
            }


            .consultorio-input input {

                width: 100%;
            }


            .titulo h1 {

                font-size: 35px;
            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <div class="cabecalho">


            <div>

                <div class="hospital-logo">

                    <div class="logo-icon">
                        +
                    </div>


                    <div>

                        <div class="hospital-name">
                            Sistema Hospitalar
                        </div>


                        <div class="hospital-subtitle">
                            CUIDADO • CONFIANÇA • ACOLHIMENTO
                        </div>

                    </div>

                </div>


                <div class="titulo">

                    <h1>
                        Painel Médico
                    </h1>


                    <p>
                        Gerencie a fila de atendimento e registre as consultas.
                    </p>

                </div>

            </div>


            <button
                class="btn-abrir-tv"
                onclick="window.open('tv.html','_blank')"
            >
                📺 ABRIR TELA DA TV
            </button>


        </div>



        <!-- =========================================
             CONSULTÓRIO
        ========================================== -->

        <div class="consultorio-input">

            <label for="consultorio-num">
                MEU CONSULTÓRIO
            </label>


            <input
                type="text"
                id="consultorio-num"
                value="01"
                maxlength="3"
            >


            <span>
                Este número será exibido na TV ao chamar o paciente.
            </span>

        </div>



        <!-- =========================================
             TRIAGENS
        ========================================== -->

        <div id="triagens"></div>



        <!-- =========================================
             DIVISÓRIA
        ========================================== -->

        <hr>



        <!-- =========================================
             CONSULTA
        ========================================== -->

        <h2 class="consulta-titulo">
            Consulta
        </h2>


        <div class="campo">

            <input
                id="paciente"
                placeholder="Paciente selecionado"
                readonly
            >

        </div>


        <div class="campo">

            <input
                id="diagnostico"
                placeholder="Diagnóstico"
            >

        </div>


        <div class="campo">

            <select id="medicacao">

                <option value="">
                    Selecione a medicação
                </option>

            </select>

        </div>


        <div class="campo">

            <textarea
                id="obs"
                placeholder="Observações"
            ></textarea>

        </div>


        <button
            class="btn-salvar"
            onclick="salvar()"
        >
            SALVAR CONSULTA
        </button>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        let triagensCarregadas = [];


        /* =========================================
           CARREGAR TRIAGENS
        ========================================== */

        function carregar() {

            fetch("/triagens")

                .then(r => r.json())

                .then(data => {

                    triagensCarregadas = data;


                    const div =
                        document.getElementById("triagens");


                    div.innerHTML = "";


                    if (data.length === 0) {

                        div.innerHTML = `
                            <p style="
                                color:#778995;
                                text-align:center;
                                font-size:11px;
                                padding:25px;
                                grid-column:1/-1;
                            ">
                                Nenhum paciente na fila.
                            </p>
                        `;

                        return;
                    }


                    data.forEach((t, index) => {

                        div.innerHTML += `

                            <div class="card">

                                <h3>
                                    ${t.nome}
                                </h3>


                                <p>
                                    <b>Sintoma:</b>
                                    ${t.sintoma || "Não informado"}
                                </p>


                                <p>
                                    <b>Temperatura:</b>
                                    ${t.temperatura || "Não informada"}°C
                                </p>


                                <p>
                                    <span class="${t.risco}">
                                        ${t.risco}
                                    </span>
                                </p>


                                <p>
                                    <b>Alergia:</b>
                                    ${t.alergia || "Nenhuma"}
                                </p>


                                <p>
                                    <b>Observação:</b>
                                    ${t.observacao || "Nenhuma"}
                                </p>


                                <div class="acoes-card">

                                    <button
                                        class="btn-atender"
                                        onclick="selecionar(${index})"
                                    >
                                        ATENDER
                                    </button>


                                    <button
                                        class="btn-tv"
                                        onclick="chamarNaTV('${t.nome}')"
                                    >
                                        📺 CHAMAR NA TV
                                    </button>

                                </div>

                            </div>

                        `;

                    });

                })

                .catch(error => {

                    console.error(
                        "Erro ao carregar triagens:",
                        error
                    );

                });

        }


        /* =========================================
           CHAMAR PACIENTE NA TV
        ========================================== */

        function chamarNaTV(nome) {

            const consultorio =
                document.getElementById("consultorio-num").value || "01";


            fetch("/tv/chamar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    localTipo: "CONSULTÓRIO",

                    localNumero: consultorio,

                    paciente: nome

                })

            })

            .then(r => r.json())

            .then(() => {

                alert(
                    "✅ " +
                    nome +
                    " foi chamado na TV para o Consultório " +
                    consultorio +
                    "!"
                );

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Não foi possível chamar o paciente na TV."
                );

            });

        }


        /* =========================================
           SELECIONAR PACIENTE
        ========================================== */

        function selecionar(index) {

            const t =
                triagensCarregadas[index];


            document.getElementById("paciente").value =
                t.nome;


            document.getElementById("obs").value =
                t.observacao || "";


            if (
                t.alergia &&
                t.alergia !== "Nenhuma"
            ) {

                alert(
                    "⚠️ Paciente possui alergia: " +
                    t.alergia
                );

            }

        }


        /* =========================================
           CARREGAR MEDICAÇÕES
        ========================================== */

        function carregarMedicacoes() {

            fetch("/lista-medicacoes")

                .then(r => r.json())

                .then(data => {

                    const select =
                        document.getElementById("medicacao");


                    select.innerHTML = `
                        <option value="">
                            Selecione a medicação
                        </option>
                    `;


                    data.forEach(med => {

                        const option =
                            document.createElement("option");


                        option.value = med;

                        option.textContent = med;


                        select.appendChild(option);

                    });

                })

                .catch(error => {

                    console.error(
                        "Erro ao carregar medicações:",
                        error
                    );

                });

        }


        /* =========================================
           SALVAR CONSULTA
        ========================================== */

        function salvar() {

            const paciente =
                document.getElementById("paciente").value;


            const diagnostico =
                document.getElementById("diagnostico").value;


            const medicacao =
                document.getElementById("medicacao").value;


            const obs =
                document.getElementById("obs").value;


            if (!paciente) {

                alert(
                    "Selecione um paciente clicando em Atender."
                );

                return;

            }


            if (!medicacao) {

                alert(
                    "Selecione uma medicação."
                );

                return;

            }


            fetch("/consulta", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    paciente,

                    diagnostico,

                    medicacao,

                    obs

                })

            })

            .then(r => r.json())

            .then(() => {

                alert(
                    "✅ Consulta salva com sucesso!"
                );


                document.getElementById("diagnostico").value =
                    "";


                document.getElementById("medicacao").value =
                    "";


                document.getElementById("obs").value =
                    "";

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Não foi possível salvar a consulta."
                );

            });

        }


        /* =========================================
           INICIALIZAÇÃO
        ========================================== */

        carregar();

        carregarMedicacoes();


        /* Atualiza a fila a cada 10 segundos */

        setInterval(carregar, 10000);

    </script>


</body>

</html>
