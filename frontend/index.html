<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistema Hospitalar</title>


    <!-- =========================================
         FONTES
    ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           PÁGINA
        ========================================== */

        body {

            font-family: "Montserrat", sans-serif;

            background: #E8EEF2;

            color: #263746;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* =========================================
           CARD DE LOGIN
        ========================================== */

        .container {

            width: 100%;

            max-width: 440px;

            background: #F8FAFB;

            padding: 48px 44px;

            border-radius: 20px;

            border: 1px solid #D8E1E7;

            box-shadow:
                0 18px 45px rgba(11, 34, 57, 0.12);
        }


        /* =========================================
           LOGO
        ========================================== */

        .hospital-logo {

            display: flex;

            align-items: center;

            gap: 13px;

            margin-bottom: 42px;
        }


        .logo-icon {

            width: 46px;

            height: 46px;

            background: #0B2239;

            color: #FFFFFF;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            font-weight: 500;
        }


        .hospital-name {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 24px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }


        .hospital-subtitle {

            color: #718493;

            font-family: "Montserrat", sans-serif;

            font-size: 9px;

            letter-spacing: 0.5px;

            margin-top: 1px;
        }


        /* =========================================
           TÍTULO
        ========================================== */

        .title-area {

            margin-bottom: 30px;
        }


        .title-area h1 {

            color: #0B2239;

            font-family: "Cormorant Garamond", serif;

            font-size: 42px;

            font-weight: 600;

            line-height: 1;

            margin-bottom: 11px;
        }


        .title-area p {

            color: #687B88;

            font-family: "Montserrat", sans-serif;

            font-size: 11px;

            line-height: 1.7;
        }


        /* =========================================
           CAMPOS
        ========================================== */

        .campo {

            margin-bottom: 19px;
        }


        .campo label {

            display: block;

            color: #304555;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.5px;

            margin-bottom: 8px;
        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border: 1px solid #D4DEE5;

            border-radius: 9px;

            background: #EEF2F4;

            color: #263746;

            font-family: "Montserrat", sans-serif;

            font-size: 12px;

            outline: none;

            transition: all 0.25s ease;
        }


        input::placeholder {

            color: #82919B;
        }


        /* =========================================
           FOCO
        ========================================== */

        input:focus {

            background: #FFFFFF;

            border-color: #0B2239;

            box-shadow:
                0 0 0 3px rgba(11, 34, 57, 0.07);
        }


        /* =========================================
           BOTÃO
        ========================================== */

        button {

            width: 100%;

            height: 53px;

            margin-top: 7px;

            border: none;

            border-radius: 9px;

            background: #0B2239;

            color: #FFFFFF;

            font-family: "Montserrat", sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: all 0.25s ease;
        }


        button:hover {

            background: #071A2B;

            transform: translateY(-1px);

            box-shadow:
                0 9px 22px rgba(11, 34, 57, 0.20);
        }


        button:active {

            transform: translateY(0);
        }


        /* =========================================
           SEGURANÇA
        ========================================== */

        .seguranca {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #DDE5EA;

            color: #778995;

            font-size: 9px;

            line-height: 1.5;

            text-align: center;
        }


        .seguranca-icon {

            color: #0B2239;

            font-size: 12px;
        }


        /* =========================================
           RESPONSIVIDADE
        ========================================== */

        @media (max-width: 600px) {

            body {

                padding: 18px;
            }


            .container {

                padding: 35px 25px;

                border-radius: 16px;
            }


            .title-area h1 {

                font-size: 36px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOGIN
    ========================================== -->

    <main class="container">


        <!-- IDENTIDADE DO HOSPITAL -->

        <div class="hospital-logo">

            <div class="logo-icon">
                +
            </div>


            <div>

                <div class="hospital-name">
                    Sistema Hospitalar
                </div>


                <div class="hospital-subtitle">
                    CUIDADO • CONFIANÇA • ACOLHIMENTO
                </div>

            </div>

        </div>



        <!-- TÍTULO -->

        <div class="title-area">

            <h1>
                Acesso
            </h1>


            <p>
                Entre com suas credenciais para acessar
                o sistema hospitalar.
            </p>

        </div>



        <!-- FORMULÁRIO -->

        <form id="formLogin">


            <!-- USUÁRIO -->

            <div class="campo">

                <label for="usuario">
                    USUÁRIO
                </label>


                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- SENHA -->

            <div class="campo">

                <label for="senha">
                    SENHA
                </label>


                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>



            <!-- BOTÃO -->

            <button type="submit">
                ENTRAR NO SISTEMA
            </button>


        </form>



        <!-- SEGURANÇA -->

        <div class="seguranca">

            <span class="seguranca-icon">
                🔒
            </span>


            <span>
                Acesso restrito a usuários autorizados.
            </span>

        </div>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        const formLogin =
            document.getElementById("formLogin");


        formLogin.addEventListener("submit", function(event) {

            event.preventDefault();


            const usuario =
                document.getElementById("usuario").value;


            const senha =
                document.getElementById("senha").value;


            fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    usuario: usuario,

                    senha: senha

                })

            })


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Usuário ou senha inválidos."
                    );

                }

                return response.json();

            })


            .then(data => {

                if (data.tipo === "triagem") {

                    location.href = "triagem.html";

                }


                if (data.tipo === "medico") {

                    location.href = "medico.html";

                }


                if (data.tipo === "atendimento") {

                    location.href = "atendimento.html";

                }

            })


            .catch(error => {

                console.error(error);

                alert(
                    "Usuário ou senha inválidos."
                );

            });

        });

    </script>


</body>

</html>
